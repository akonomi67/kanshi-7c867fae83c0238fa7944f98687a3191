<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>見張り</title>
<!-- データは data.json (AES-256-GCM, PBKDF2-SHA256 200000回, base64のsalt/iv/ct。ctの末尾16バイトが認証タグ)。パスワードは #pw=... か ?pw=... でも渡せる -->
<style>body{font:17px/1.6 system-ui,sans-serif;margin:0 auto;max-width:720px;padding:16px;background:#111;color:#eee}
h2{margin:26px 0 8px;font-size:20px}.r{color:#ff6b6b}.g{color:#7ee787}.d{color:#999;font-size:14px}
.big{font-size:26px;font-weight:bold;line-height:1.5;margin:8px 0}
.box{border-radius:10px;padding:12px 14px;margin:8px 0;font-size:17px}.red{background:#4a1a1a;border:2px solid #ff6b6b}.yel{background:#3b3000;border:2px solid #ffd54a}.y{color:#ffd54a;margin:14px 0 4px}.green{background:#14301c;border:2px solid #7ee787;font-weight:bold}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #333;padding:8px 6px;text-align:left;vertical-align:top;font-size:16px}th{color:#999;font-weight:normal;font-size:14px}
td.done{color:#7ee787}td.soon{color:#ffd54a}td.late{color:#ff6b6b}
details{margin:10px 0;border:1px solid #333;border-radius:10px;padding:10px 12px}summary{font-size:18px;cursor:pointer}
input{font-size:18px;padding:8px}@media(max-width:560px){td,th{font-size:15px;padding:6px 3px}}</style></head><body>
<div id="lock"><p>パスワード <input id="pw" type="password"> <button onclick="go(document.getElementById('pw').value)">開く</button></p></div>
<div id="app"></div>
<script>
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(t,now){const m=Math.floor((now-t)/60);return m<60?m+"分前":Math.floor(m/60)+"時間"+(m%60)+"分前"}
async function go(pw){
 try{
  const e=await (await fetch("data.json?"+Date.now())).json();
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(e.salt),iterations:e.iter,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(e.iv)},k,b(e.ct))));
  if(e.ct!==window.LAST){window.LAST=e.ct;const op=[...document.querySelectorAll("#app details")].map(x=>x.open);render(d);document.querySelectorAll("#app details").forEach((x,i)=>{if(op[i])x.open=true})}document.getElementById("lock").style.display="none";if(!window.TM){window.TM=setInterval(()=>go(pw),20000)}
 }catch(x){if(window.LAST)return;document.getElementById("app").textContent="開けません（パスワード違い）"}
}
const HM=t=>{const x=new Date(t*1000);return String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0")};
function rel(t,now){const m=Math.round((t-now)/60),a=Math.abs(m);const u=a<60?a+"分":Math.floor(a/60)+"時間"+(a%60?a%60+"分":"");return m>=0?u+"後":u+"前"}
function model(d,now){
 const T=d.teiki||{rows:[],unknown:[]};const alert=[],today=[],single=[];
 for(const w of d.windows){const open=w.yk.filter(x=>!x.d);if(!open.length)continue;const idle=now-w.last>1800;
  single.push({name:w.title||"(無題)",done:w.yk.length-open.length,all:w.yk.length,last:ago(w.last,now),idle:idle,open:open.map(x=>x.t)});
  if(idle)alert.push({what:w.title||"(無題)",why:"止まっている（最後の動き "+ago(w.last,now)+"）。残り "+open.length+"件"});
  today.push({at:0,when:"随時",what:(w.title||"(無題)")+"：残り"+open.length+"件",who:"くろこ",st:idle?"late":"soon"})}
 for(const r of T.rows){if(r.st==="late")alert.push({what:r.name,why:"遅れ／失敗している"});
  if(r.at||r.st==="late"){const past=r.at&&r.at<now;today.push({at:r.at||0,when:r.at?HM(r.at)+"（"+rel(r.at,now)+"）":"随時",what:r.name,who:r.who,st:r.st==="late"?"late":(past?"done":"soon")})}}
 if(now-d.generated>900)alert.push({what:"見張りサイト",why:"15分以上更新が止まっている"});
 today.sort((a,b)=>(a.at||9e12)-(b.at||9e12));
 const sched=today.filter(x=>x.at),done=sched.filter(x=>x.st==="done").length,late=today.filter(x=>x.st==="late").length;
 const KW=((d.koutei||{}).watch)||[];
 return {alert,checks:(T.checks||[]).concat(KW),today,single,teiki:T.rows,unknown:T.unknown,tags:d.tags.filter(t=>now-t.updated>86400).map(t=>t.project),logs:d.worklog,
  head:['止まっている作業・遅れ '+alert.length+'件','今日の定期 '+sched.length+'件（済み '+done+'）','遅れ '+late+'件','要確認 '+((T.checks||[]).length+KW.length)+'件'],made:d.generated_h}}
function stopUnits(d){const K=(d.koutei||{rows:[]}).rows,U={};for(const r of K){const k=r[0]+"\u0001"+r[1]+"\u0001"+r[2];(U[k]=U[k]||[]).push(r)}
 return Object.values(U).filter(g=>g.every(r=>r[10]==="一旦停止"||r[10]==="終了"))}
function stopHtml(d){const S=stopUnits(d);
 return '<details><summary>停止中の仕事（'+S.length+'件）</summary><table><tr><th>仕事</th><th>状態</th><th>止めた日</th><th>理由</th><th>誰の指示か</th><th>確かさ</th></tr>'+S.map(g=>{const r=g[0];return '<tr class="it" data-s="stopjob" style="color:#aaa'+(/推定/.test(r[12])?";background:#3b3000":"")+'"><td>'+esc(r[0]+"／"+r[1]+(r[2]?"／"+r[2]:""))+'</td><td>'+esc(r[10])+'</td><td>'+esc(r[11])+'</td><td>'+esc(r[12])+'</td><td>'+esc(r[13])+'</td><td>'+(/推定/.test(r[12])?"推定（要確認）":"確定")+'</td></tr>'}).join('')+'</table></details>'}
function kouteiHtml(d){const K=(d.koutei||{rows:[]}).rows,g={};for(const r of K){((g[r[0]]=g[r[0]]||{})[r[1]]=g[r[0]][r[1]]||[]).push(r)}
 let h=stopHtml(d)+'<details><summary>ch別・仕事別の工程と担当（'+K.length+'行・要確認 '+K.filter(r=>r[9]!=="確定").length+'）</summary>';
 for(const f in g){const n=Object.values(g[f]).reduce((a,b)=>a+b.length,0),q=Object.values(g[f]).reduce((a,b)=>a+b.filter(r=>r[9]!=="確定").length,0);
  h+='<details><summary>'+esc(f)+'（'+n+'行・要確認 '+q+'）</summary>';
  for(const j in g[f]){const a=g[f][j];h+='<details><summary>'+esc(j)+'（要確認 '+a.filter(r=>r[9]!=="確定").length+'）</summary><table><tr><th>区分</th><th>工程</th><th>細目</th><th>誰が</th><th>運用</th><th>確かさ</th></tr>'+a.map(r=>'<tr class="it" data-s="koutei" style="'+(r[10]!=="動いている"?"color:#aaa;":"")+(r[9]!=="確定"?"background:#3b3000":"")+'"><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>'+esc(r[4])+'</td><td>'+esc(r[5])+'</td><td>'+esc(r[10])+'</td><td>'+esc(r[9])+'</td></tr>').join('')+'</table></details>'}
  h+='</details>'}
 return h+'</details>'}
const NM={done:"済",soon:"これから",late:"遅れ"};
function single1(x){return esc(x.name)+'：済 '+x.done+'/'+x.all+'・'+esc(x.last)+(x.idle?'（30分以上動きなし）':'')+'<br>'+x.open.map(t=>'残 '+esc(t)).join('<br>')}
function render(d){
 const now=Date.now()/1000,m=model(d,now);
 let h='<div class="big '+(m.alert.length?'r':'g')+'">'+m.head.join('<br>')+'</div><p class="d">作った時刻 '+esc(m.made)+'</p>';
 h+='<h2>① 要注意</h2>';
 h+=m.alert.length?m.alert.map(a=>'<div class="box red it" data-s="alert"><b>'+esc(a.what)+'</b><br>'+esc(a.why)+'</div>').join(''):'<div class="box green">問題なし</div>';
 h+=m.checks.length?'<h3 class="y">要確認（'+m.checks.length+'件）</h3>'+m.checks.map(a=>'<div class="box yel it" data-s="check"><b>'+esc(a.what)+'</b><br>'+esc(a.why)+'</div>').join(''):'';
 h+='<h2>② 今日やること</h2><table><tr><th>いつ</th><th>何を</th><th>誰が</th><th>状態</th></tr>';
 for(const x of m.today)h+='<tr class="it" data-s="today"><td>'+esc(x.when)+'</td><td>'+esc(x.what)+'</td><td>'+esc(x.who)+'</td><td class="'+x.st+'"><b>'+NM[x.st]+'</b></td></tr>';
 h+='</table><h2>③ その他</h2>';
 h+='<details><summary>全部の定期（'+m.teiki.length+'件）</summary><table><tr><th>何を</th><th>誰が</th><th>いつ</th><th>次は</th></tr>'+m.teiki.map(r=>'<tr class="it" data-s="teiki"><td>'+esc(r.name)+'</td><td>'+esc(r.who)+'</td><td>'+esc(r.when)+'</td><td>'+esc(r.next)+'</td></tr>').join('')+'</table><p class="d">頻度不明（間隔が空欄）：'+m.unknown.map(u=>'<span class="it" data-s="unknown">'+esc(u.name)+'</span>').join(' ／ ')+'</p></details>';
 h+=kouteiHtml(d);
 h+='<details><summary>単発のやること全部（'+m.single.length+'案件）</summary>'+m.single.map(x=>'<p class="it" data-s="single">'+single1(x)+'</p>').join('')+'</details>';
 h+='<details><summary>外し忘れ？の名札（'+m.tags.length+'件）</summary><p>'+(m.tags.map(t=>'<span class="it" data-s="tag">'+esc(t)+'</span>').join(' ／ ')||'なし')+'</p></details>';
 h+='<details><summary>作業ログの件名（直近24時間 '+m.logs.length+'件）</summary><table>'+m.logs.map(l=>'<tr class="it" data-s="log"><td class="d">'+esc(l.ts.slice(11,16))+'</td><td>'+esc(l.title)+'</td></tr>').join('')+'</table></details>';
 document.getElementById("app").innerHTML=h}
const q=(location.hash.match(/pw=([^&]+)/)||location.search.match(/pw=([^&]+)/));
if(q)go(decodeURIComponent(q[1]));
</script></body></html>
